version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airw-postgres
    environment:
      POSTGRES_USER: airw
      POSTGRES_PASSWORD: airw_dev_password
      POSTGRES_DB: airw_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airw -d airw_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airw-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airw:airw_dev_password@postgres:5432/airw_dev
      DATABASE_URL_SYNC: postgresql://airw:airw_dev_password@postgres:5432/airw_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airw-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
