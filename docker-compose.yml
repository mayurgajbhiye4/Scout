services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airw-postgres
    environment:
      POSTGRES_USER: airw
      POSTGRES_PASSWORD: airw_dev_password
      POSTGRES_DB: airw_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airw -d airw_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: airw-neo4j
    environment:
      NEO4J_AUTH: neo4j/airw_dev_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airw-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://airw:airw_dev_password@postgres:5432/airw_dev
      DATABASE_URL_SYNC: postgresql://airw:airw_dev_password@postgres:5432/airw_dev
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: airw_dev_password
      # Hugging Face model cache (reranker), kept on the hfcache volume so it survives container rebuilds
      HF_HOME: /hf-cache
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hfcache:/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airw-frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  neo4jdata:
  hfcache:
